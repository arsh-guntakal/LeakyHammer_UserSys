[project]
name = "leakyhammer"
version = "0.1.0"
description = "LeakyHammer covert channels against RowHammer defenses (PRAC, RFM, DREAM-C, RRS) on gem5 + Ramulator2."
readme = "README.md"
# Python 3.8 matches the container's system Python, which gem5 embeds. Keep
# the analysis stack pinned so figures and numbers stay comparable to the
# published artifact.
requires-python = ">=3.8,<3.9"
dependencies = [
    "matplotlib==3.1.2",
    "numpy==1.17.4",
    "pandas==1.3.4",
    "pyyaml>=6.0.3",
    "scipy==1.3.3",
    "seaborn==0.11.2",
    "wget==3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "scons==3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakyhammer"]

[tool.uv]
environments = ["platform_machine == 'x86_64'"]
default-groups = ["dev"]

# PyTest only reads "[tool.pytest.ini_options]" from this file.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests (no gem5, no compiler)",
    "integration: needs the built simulator and compiled attack binaries",
    "slow: takes more than a minute",
    "regression: previously-fixed bugs",
    "experiment: end-to-end experiments",
]
# Keep gem5's own test tree and vendored code out of collection.
norecursedirs = ["gem5", ".venv", "results", "build"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py38"
extend-exclude = ["gem5"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # modern Python syntax
    "SIM",  # simplify code
    "ANN",  # type annotations
    "D",    # docstrings
    "RET",  # return statement consistency
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests need not annotate/document every helper as strictly.
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"
