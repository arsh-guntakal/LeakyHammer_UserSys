name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Python 3.8 and the pinned analysis stack come from pyproject/uv.lock.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check

      - name: Check lint
        run: uv run ruff check

      # The simulator is not built in CI, so slow/integration tests are skipped.
      - name: Unit tests
        run: uv run pytest -m "not slow and not integration"
